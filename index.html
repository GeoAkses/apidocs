<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Dokumentasi REST API GeoAkses untuk rute, halte, bus, dan jadwal transportasi publik." />
    <title>GeoAkses API — Swagger UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; background: #f5f7fa; }
      .topbar { display: none; }
      .swagger-ui .info { margin: 28px 0; }
      .swagger-ui .scheme-container { box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js" defer></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (!window.SwaggerUIBundle) {
          document.getElementById("swagger-ui").textContent = "Swagger UI gagal dimuat. Periksa koneksi CDN atau buka openapi.yaml.";
          return;
        }
        window.ui = SwaggerUIBundle({
          url: "./openapi.yaml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayRequestDuration: true,
          filter: true,
          presets: [SwaggerUIBundle.presets.apis],
          layout: "BaseLayout"
        });
      });
    </script>
  </body>
</html>
